services:
  web:
    image: ${DOCKER_HUB_USERNAME}/app:${APP_VERSION:-latest}
    container_name: lms_web
    command: sh -c "python manage.py migrate && python manage.py collectstatic --noinput && gunicorn config.wsgi:application --bind 0.0.0.0:8000"
    volumes:
      - static_volume:/app/staticfiles
    expose:
      - "8000"
    environment:
      - POSTGRES_HOST=db
      - DJANGO_ALLOWED_HOSTS=${DJANGO_ALLOWED_HOSTS}
      - DEBUG=False
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    env_file:
      - .env
    restart: unless-stopped

  nginx:
    image: nginx:1.25-alpine
    container_name: nginx-1
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - static_volume:/app/staticfiles
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - web
    restart: unless-stopped

  db:
    image: postgres:16
    container_name: db-1
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backups:/backups
    environment:
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    env_file:
      - .env
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d ${POSTGRES_DB} -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: lms_redis
    env_file:
      - .env
    expose:
      - "6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped

  celery:
    image: ${DOCKER_HUB_USERNAME}/app:${APP_VERSION:-latest}
    container_name: lms_celery
    command: celery -A config worker --loglevel=info
    volumes:
      - static_volume:/app/staticfiles
    environment:
      - DEBUG=False
      - REDIS_HOST=redis
      - POSTGRES_HOST=db
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
      web:
        condition: service_started
    restart: unless-stopped

  celery_beat:
    image: ${DOCKER_HUB_USERNAME}/app:${APP_VERSION:-latest}
    container_name: lms_celery_beat
    command: celery -A config beat --loglevel=info
    volumes:
      - static_volume:/app/staticfiles
    environment:
      - DEBUG=False
      - REDIS_HOST=redis
      - POSTGRES_HOST=db
      - CELERY_BEAT_SCHEDULER=django_celery_beat.schedulers:DatabaseScheduler
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
      web:
        condition: service_started
    restart: unless-stopped

volumes:
  postgres_data:
  static_volume:
  redis_data: