version: '3.9'

services:
  web:
    build: .
    container_name: lms_web
    command: sh -c "python manage.py migrate && python manage.py collectstatic --noinput && gunicorn config.wsgi:application --bind 0.0.0.0:8000 && python manage.py runserver"
    volumes:
      - .:/app
      - static_volume:/app/staticfiles
    expose:
      - "8000"
    ports:
      - "8000:8000"
    environment:
      - POSTGRES_HOST=db
      - DJANGO_ALLOWED_HOSTS=0.0.0.0 localhost [::1]
    depends_on:
      - db
      - redis
    env_file:
      - .env

  nginx:
    build:
      context: ./nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - static_volume:/app/staticfiles
    depends_on:
      - web

  db:
    image: postgres:16
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_HOST=db
    env_file:
      - ./.env
    expose:
      - "5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -d ${POSTGRES_DB} -U ${POSTGRES_USER}" ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    image: redis:7-alpine
    container_name: lms_redis
    env_file:
      - ./.env
    expose:
      - "6379"
    ports:
      - "6379:6379"
    restart: unless-stopped

  celery:
    build: .
    container_name: lms_celery
    command: celery -A config worker --loglevel=info
    volumes:
      - .:/app
    environment:
      - DEBUG=False
      - REDIS_HOST=redis
      - POSTGRES_HOST=db
    env_file:
      - .env
    depends_on:
      - db
      - redis
      - web
    restart: unless-stopped

  celery_beat:
    build: .
    container_name: lms_celery_beat
    command: celery -A config beat --loglevel=info
    volumes:
      - .:/app
    environment:
      - DEBUG=False
      - REDIS_HOST=redis
      - POSTGRES_HOST=db
      - CELERY_BEAT_SCHEDULER=django_celery_beat.schedulers:DatabaseScheduler
    env_file:
      - .env
    depends_on:
      - db
      - redis
      - web
    restart: unless-stopped

volumes:
  postgres_data:
  static_volume:
